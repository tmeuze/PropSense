%% EMQX file-based ACL example for ha-unity (Erlang tuple format).
%%
%% Usernames: hub, alpha, beta (rename to your own units). One unique client
%% id per client. Rules are evaluated top to bottom, first match wins. The
%% default file authorizer ends in {allow, all}: REPLACE it, do not append.
%% Denied publishes are dropped silently; check the EMQX authorization log.
%% Test every user with one allowed and one forbidden topic before trusting it.
%% Rule syntax was checked against EMQX 6.x behaviour only; verify on yours.

%% --- baseline ---
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

%% --- hub: the only door. Publishes to each unit's own prefix. ---
{allow, {username, {re, "^hub$"}}, subscribe, ["homeassistant/#", "alpha/#", "beta/#"]}.
{allow, {username, {re, "^hub$"}}, publish,   ["homeassistant/status", "ha-unity/hub/#", "alpha/#", "beta/#"]}.

%% --- alpha (child) ---
%% No access to anything the hub owns (device bridges, discovery, other units).
%% Reads its own prefix and the hub availability marker. Writes only command
%% topics and its own MQTT birth/will topic.
{allow, {username, {re, "^alpha$"}}, subscribe, ["alpha/#", "ha-unity/hub/status"]}.
{allow, {username, {re, "^alpha$"}}, publish,   ["alpha/status", "alpha/+/+/set", "alpha/climate/+/+/set"]}.

%% --- beta (child) ---
{allow, {username, {re, "^beta$"}}, subscribe, ["beta/#", "ha-unity/hub/status"]}.
{allow, {username, {re, "^beta$"}}, publish,   ["beta/status", "beta/+/+/set", "beta/climate/+/+/set"]}.

%% --- everything else ---
{deny, all}.
