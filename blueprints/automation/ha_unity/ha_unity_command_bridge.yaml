# Unity (pre-1.0): command bridge. Core path verified live on HA 2026.9.x (see README status).
#
# On the hub, the ONLY path from a child's command to a real entity (lights and
# switches). Same whitelist policy as the publishers, re-checked on EVERY
# command, so a stale child dashboard or a hand-crafted publish cannot act on
# an entity that is not currently exposed to that unit.
#
# Hard limits by construction:
#   - Services are hardcoded: light.turn_on/off and switch.turn_on/off.
#     A service or entity is never taken from the payload.
#   - The entity comes from the topic and must be in the `exposed` list.
#   - Locks, covers, climate, scripts etc. are not handled here at all.
#   - Brightness is clamped to 1..255. Colour temperature (kelvin) is clamped to
#     the light's own range. Colour (hs, xy, rgb) is clamped to its valid range
#     and only accepted if the light supports that colour model.
#   - Anything unparseable is ignored (no error, no action).
#
# The `command_topic` input must be exactly "<unit>/+/+/set". The broker ACL
# for the child should allow publish on that pattern only
# (docs/emqx-acl-example.conf).

blueprint:
  name: "Unity: command bridge (lights, switches)"
  description: >-
    Re-checks the whitelist policy, then calls light/switch turn_on/turn_off
    for commands a child publishes to <unit>/<domain>/<object>/set.
  domain: automation
  source_url: https://github.com/tmeuze/ha-unity/blob/main/blueprints/automation/ha_unity/ha_unity_command_bridge.yaml
  input:
    unit:
      name: Unit prefix
      selector:
        text:
    command_topic:
      name: Command topic filter
      description: "Exactly <unit>/+/+/set, e.g. alpha/+/+/set"
      selector:
        text:
    unit_label:
      name: Unit label
      description: "Entities with this label (e.g. Live: Alpha) are exposed to this unit."
      selector:
        label: {}
    unit_floors:
      name: Unit floors
      description: "Floor(s) the unit label is valid on (e.g. Alpha). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    common_label:
      name: Common label
      description: "Entities with this label (e.g. Live: Shared) are exposed to every unit."
      selector:
        label: {}
    common_floors:
      name: Common floors
      description: "Floor(s) the common label is valid on (e.g. Shared). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    blocked_cover_classes:
      name: Blocked cover device classes
      description: "Covers of these device classes are never exposed (safety default: garage doors, gates, doors). A cover whose state is unavailable is never exposed."
      default:
        - garage
        - gate
        - door
      selector:
        select:
          multiple: true
          options:
            - awning
            - blind
            - curtain
            - damper
            - door
            - garage
            - gate
            - shade
            - shutter
            - window

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input command_topic

variables:
  unit: !input unit
  unit_label: !input unit_label
  unit_floors: !input unit_floors
  common_label: !input common_label
  common_floors: !input common_floors
  blocked_covers: !input blocked_cover_classes
  domains: ["light", "switch", "fan", "scene", "cover"]
  parts: "{{ trigger.topic.split('/') }}"
  domain: "{{ parts[1] if parts | length == 4 else '' }}"
  obj: "{{ parts[2] if parts | length == 4 else '' }}"
  entity: "{{ domain ~ '.' ~ obj }}"
  exposed: >-
    {% set ns = namespace(ua=[], ca=[], out=[]) %}
    {% for f in unit_floors %}{% set ns.ua = ns.ua + floor_areas(f) %}{% endfor %}
    {% for f in common_floors %}{% set ns.ca = ns.ca + floor_areas(f) %}{% endfor %}
    {% for e in label_entities(unit_label) %}
      {% if area_id(e) in ns.ua and e.split('.')[0] in domains and e not in ns.out and not (e.startswith('cover.') and (states(e) in ['unavailable', 'unknown'] or state_attr(e, 'device_class') in blocked_covers)) %}{% set ns.out = ns.out + [e] %}{% endif %}
    {% endfor %}
    {% for e in label_entities(common_label) %}
      {% if area_id(e) in ns.ca and e.split('.')[0] in domains and e not in ns.out and not (e.startswith('cover.') and (states(e) in ['unavailable', 'unknown'] or state_attr(e, 'device_class') in blocked_covers)) %}{% set ns.out = ns.out + [e] %}{% endif %}
    {% endfor %}
    {{ ns.out }}
  p: "{{ trigger.payload_json if trigger.payload_json is defined else {} }}"
  word: "{{ trigger.payload | upper }}"

conditions:
  - condition: template
    value_template: "{{ parts | length == 4 and parts[0] == unit and parts[3] == 'set' }}"
  - condition: template
    value_template: "{{ domain in domains }}"
  - condition: template
    value_template: "{{ entity in exposed }}"

actions:
  - choose:
      - conditions: "{{ domain == 'light' and (p.state | default('') | upper) == 'ON' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ entity }}"
            data: >-
              {% set modes = state_attr(entity, 'supported_color_modes') or [] %}
              {% set c = p.color if (p.color is defined and p.color is mapping) else {} %}
              {% set d = {} %}
              {% if p.brightness is defined %}{% set d = d | combine({'brightness': [[p.brightness | int(255), 1] | max, 255] | min}) %}{% endif %}
              {% if p.color_temp is defined and 'color_temp' in modes %}
                {% set lo = state_attr(entity, 'min_color_temp_kelvin') | int(2000) %}
                {% set hi = state_attr(entity, 'max_color_temp_kelvin') | int(6535) %}
                {% set d = d | combine({'color_temp_kelvin': [[p.color_temp | int(hi), lo] | max, hi] | min}) %}
              {% endif %}
              {% if 'h' in c and 's' in c and 'hs' in modes %}{% set d = d | combine({'hs_color': [[[c.h | float(0), 0] | max, 360] | min, [[c.s | float(0), 0] | max, 100] | min]}) %}{% endif %}
              {% if 'x' in c and 'y' in c and 'xy' in modes %}{% set d = d | combine({'xy_color': [[[c.x | float(0), 0] | max, 1] | min, [[c.y | float(0), 0] | max, 1] | min]}) %}{% endif %}
              {% if 'r' in c and 'g' in c and 'b' in c and (modes | select('in', ['rgb', 'rgbw', 'rgbww']) | list | length > 0) %}{% set d = d | combine({'rgb_color': [[[c.r | int(0), 0] | max, 255] | min, [[c.g | int(0), 0] | max, 255] | min, [[c.b | int(0), 0] | max, 255] | min]}) %}{% endif %}
              {% if p.effect is defined and p.effect in (state_attr(entity, 'effect_list') or []) %}{% set d = d | combine({'effect': p.effect}) %}{% endif %}
              {{ d }}
      - conditions: "{{ domain == 'light' and (p.state | default('') | upper) == 'OFF' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'switch' and word == 'ON' }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'switch' and word == 'OFF' }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ entity }}"
      # ---- fans: one JSON command topic; features gate each command ----
      - conditions: "{{ domain == 'fan' and (p.state | default('') | upper) == 'ON' }}"
        sequence:
          - action: fan.turn_on
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'fan' and (p.state | default('') | upper) == 'OFF' }}"
        sequence:
          - action: fan.turn_off
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'fan' and p.percentage is defined and p.percentage | float(none) is not none and (state_attr(entity, 'supported_features') | int(0) // 1) % 2 == 1 }}"
        sequence:
          - action: fan.set_percentage
            target:
              entity_id: "{{ entity }}"
            data:
              percentage: "{{ [[p.percentage | float(0) | round(0) | int, 0] | max, 100] | min }}"
      - conditions: "{{ domain == 'fan' and p.preset_mode is defined and p.preset_mode in (state_attr(entity, 'preset_modes') or []) and (state_attr(entity, 'supported_features') | int(0) // 8) % 2 == 1 }}"
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: "{{ entity }}"
            data:
              preset_mode: "{{ p.preset_mode }}"
      - conditions: "{{ domain == 'fan' and p.oscillating is defined and p.oscillating in [true, false] and (state_attr(entity, 'supported_features') | int(0) // 2) % 2 == 1 }}"
        sequence:
          - action: fan.oscillate
            target:
              entity_id: "{{ entity }}"
            data:
              oscillating: "{{ p.oscillating }}"
      - conditions: "{{ domain == 'fan' and p.direction is defined and p.direction in ['forward', 'reverse'] and (state_attr(entity, 'supported_features') | int(0) // 4) % 2 == 1 }}"
        sequence:
          - action: fan.set_direction
            target:
              entity_id: "{{ entity }}"
            data:
              direction: "{{ p.direction }}"
      # ---- scenes: the scene's own contents are the privilege ----
      - conditions: "{{ domain == 'scene' and word == 'ON' }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ entity }}"
      # ---- covers: open, close, stop, position (tilt is not carried) ----
      - conditions: "{{ domain == 'cover' and p.command is defined and p.command == 'open' and (state_attr(entity, 'supported_features') | int(0) // 1) % 2 == 1 }}"
        sequence:
          - action: cover.open_cover
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'cover' and p.command is defined and p.command == 'close' and (state_attr(entity, 'supported_features') | int(0) // 2) % 2 == 1 }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'cover' and p.command is defined and p.command == 'stop' and (state_attr(entity, 'supported_features') | int(0) // 8) % 2 == 1 }}"
        sequence:
          - action: cover.stop_cover
            target:
              entity_id: "{{ entity }}"
      - conditions: "{{ domain == 'cover' and p.position is defined and p.position | float(none) is not none and (state_attr(entity, 'supported_features') | int(0) // 4) % 2 == 1 }}"
        sequence:
          - action: cover.set_cover_position
            target:
              entity_id: "{{ entity }}"
            data:
              position: "{{ [[p.position | float(0) | round(0) | int, 0] | max, 100] | min }}"
