# Unity (pre-1.0): publish discovery. Core path verified live on HA 2026.9.x (see README status).
#
# On the hub, publish retained MQTT discovery for one unit's exposed entities
# (lights, switches, sensors, binary sensors). Create one automation per unit.
#
# WHITELIST POLICY (fail closed). An entity is exposed to a unit only if
#   (the unit label AND an area on one of the unit's floors)
#   OR (the common label AND an area on one of the common floors),
# and its domain is in the hardcoded list below. Unlabelled entities, entities
# with no area, entities on any floor you do not list, and a label on the wrong
# floor are never exposed. The domain list is deliberately not an input.
#
# Keep the `exposed` template identical in the discovery, state and command
# blueprints. tests/policy_model.py models the intended logic.
#
# Each entity gets a device block (identifiers scoped to the unit) and a
# suggested_area. If area_prefix_regex matches the hub area name, the prefix is
# stripped ("L2 Kitchen" -> "Kitchen"); areas on the common floors pass through
# unchanged; otherwise no suggested_area is sent.
#
# KNOWN GAP: entities deleted from HA entirely keep a stale retained discovery
# topic on the broker. Revocation (label removed, area or floor changed)
# publishes an empty retained payload.

blueprint:
  name: "Unity: publish discovery"
  description: >-
    Publishes retained MQTT discovery under <unit>/ha/ for entities that pass
    the whitelist policy, and clears it for entities that no longer do.
  domain: automation
  source_url: https://github.com/tmeuze/ha-unity/blob/main/blueprints/automation/ha_unity/ha_unity_publish_discovery.yaml
  input:
    unit:
      name: Unit prefix
      description: "Topic prefix and child name, e.g. alpha. Lowercase, no slashes."
      selector:
        text:
    unit_label:
      name: Unit label
      description: "Entities with this label (e.g. Live: Alpha) are exposed to this unit."
      selector:
        label: {}
    unit_floors:
      name: Unit floors
      description: "Floor(s) the unit label is valid on (e.g. Alpha). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    common_label:
      name: Common label
      description: "Entities with this label (e.g. Live: Shared) are exposed to every unit."
      selector:
        label: {}
    common_floors:
      name: Common floors
      description: "Floor(s) the common label is valid on (e.g. Shared). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    hub_status_topic:
      name: Hub availability topic
      description: "Retained topic that reads 'online' while the hub is up (its MQTT will message should set 'offline'). Child entities are unavailable unless it reads online."
      default: "ha-unity/hub/status"
      selector:
        text:
    area_prefix_regex:
      name: Area prefix to strip (optional)
      description: "Regex for a prefix on hub area names that should NOT reach the child, e.g. ^L[0-9]+  turns 'L2 Kitchen' into 'Kitchen' for suggested_area. Leave empty to send names unchanged."
      default: ""
      selector:
        text:
    blocked_cover_classes:
      name: Blocked cover device classes
      description: "Covers of these device classes are never exposed (safety default: garage doors, gates, doors). A cover whose state is unavailable is never exposed."
      default:
        - garage
        - gate
        - door
      selector:
        select:
          multiple: true
          options:
            - awning
            - blind
            - curtain
            - damper
            - door
            - garage
            - gate
            - shade
            - shutter
            - window

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
  # Safety net only: everything else is event driven.
  - trigger: time_pattern
    hours: "/6"
    minutes: "0"
    seconds: "0"
  - trigger: event
    event_type: entity_registry_updated
  - trigger: event
    event_type: device_registry_updated
  - trigger: event
    event_type: area_registry_updated
  - trigger: event
    event_type: floor_registry_updated
  - trigger: event
    event_type: label_registry_updated

variables:
  unit: !input unit
  unit_label: !input unit_label
  unit_floors: !input unit_floors
  common_label: !input common_label
  common_floors: !input common_floors
  hub_status_topic: !input hub_status_topic
  area_prefix: !input area_prefix_regex
  blocked_covers: !input blocked_cover_classes
  domains: ["light", "switch", "sensor", "binary_sensor", "fan", "scene", "cover"]

actions:
  # Debounce bursts of registry events (mode: restart cancels earlier runs).
  - delay: "00:00:05"
  - variables:
      exposed: >-
        {% set ns = namespace(ua=[], ca=[], out=[]) %}
        {% for f in unit_floors %}{% set ns.ua = ns.ua + floor_areas(f) %}{% endfor %}
        {% for f in common_floors %}{% set ns.ca = ns.ca + floor_areas(f) %}{% endfor %}
        {% for e in label_entities(unit_label) %}
          {% if area_id(e) in ns.ua and e.split('.')[0] in domains and e not in ns.out and not (e.startswith('cover.') and (states(e) in ['unavailable', 'unknown'] or state_attr(e, 'device_class') in blocked_covers)) %}{% set ns.out = ns.out + [e] %}{% endif %}
        {% endfor %}
        {% for e in label_entities(common_label) %}
          {% if area_id(e) in ns.ca and e.split('.')[0] in domains and e not in ns.out and not (e.startswith('cover.') and (states(e) in ['unavailable', 'unknown'] or state_attr(e, 'device_class') in blocked_covers)) %}{% set ns.out = ns.out + [e] %}{% endif %}
        {% endfor %}
        {{ ns.out }}
      common_area_names: >-
        {% set ns = namespace(n=[]) %}
        {% for f in common_floors %}{% for a in floor_areas(f) %}{% set ns.n = ns.n + [area_name(a)] %}{% endfor %}{% endfor %}
        {{ ns.n }}
      stale: >-
        {% set ns = namespace(out=[]) %}
        {% for s in states %}
          {% if s.domain in domains and s.entity_id not in exposed %}
            {% set ns.out = ns.out + [s.entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}

  # Revoke: clear discovery for anything that is not (or no longer) exposed.
  - repeat:
      for_each: "{{ stale }}"
      sequence:
        - action: mqtt.publish
          data:
            topic: "{{ unit }}/ha/{{ repeat.item.split('.')[0] }}/{{ repeat.item.split('.')[1] }}/config"
            payload: ""
            retain: true

  # Publish discovery for exposed entities.
  - repeat:
      for_each: "{{ exposed }}"
      sequence:
        - variables:
            domain: "{{ repeat.item.split('.')[0] }}"
            obj: "{{ repeat.item.split('.')[1] }}"
            base: "{{ unit }}/{{ repeat.item.split('.')[0] }}/{{ repeat.item.split('.')[1] }}"
            # With area_prefix_regex "^L[0-9]+ ", a hub area named "L2 Kitchen" reaches the
            # child as "Kitchen".
            # No Lx prefix (catch-all or common areas) => no suggested_area
            # for the unit catch-alls; common areas pass their own name.
            area_nm: "{{ area_name(repeat.item) }}"
            sa: >-
              {% if area_nm and area_prefix and area_nm is match(area_prefix) -%}{{ area_nm | regex_replace(area_prefix, '') }}{%- elif area_nm and area_nm in common_area_names -%}{{ area_nm }}{%- endif %}
            dev_id: "{{ device_id(repeat.item) }}"
            dev_name: "{{ device_attr(dev_id, 'name') if dev_id else state_attr(repeat.item, 'friendly_name') }}"
            fname: "{{ state_attr(repeat.item, 'friendly_name') }}"
            # MQTT entities with a device are named "<device> <entity name>", so
            # sending the full friendly name doubles it. Send null when the
            # entity IS the device, else the name minus the device-name prefix.
            ent_name: >-
              {% if not dev_name or fname == dev_name %}{{ none }}{% elif fname.startswith(dev_name ~ ' ') %}{{ fname[(dev_name | length + 1):] }}{% else %}{{ fname }}{% endif %}
            device: >-
              {% set d = {
                'identifiers': [unit ~ '_dev_' ~ (dev_id if dev_id else repeat.item)],
                'name': dev_name
              } %}
              {% if sa %}{% set d = d | combine({'suggested_area': sa}) %}{% endif %}
              {{ d }}
            common: >-
              {{ {
                'device': device,
                'name': ent_name,
                'unique_id': unit ~ '_' ~ repeat.item.replace('.', '_'),
                'availability': [{'topic': hub_status_topic}, {'topic': base ~ '/availability'}],
                'availability_mode': 'all'
              } }}
        - choose:
            - conditions: "{{ domain == 'light' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/light/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {% set raw = state_attr(repeat.item, 'supported_color_modes') or [] %}
                      {% set ns = namespace(m=[]) %}
                      {% for x in raw %}{% set y = 'rgb' if x in ['rgbw', 'rgbww'] else x %}{% if y in ['onoff', 'brightness', 'color_temp', 'hs', 'xy', 'rgb'] and y not in ns.m %}{% set ns.m = ns.m + [y] %}{% endif %}{% endfor %}
                      {% if not ns.m %}{% set ns.m = ['brightness'] if raw else ['onoff'] %}{% endif %}
                      {% set d = common | combine({'schema': 'json', 'state_topic': base ~ '/state', 'command_topic': base ~ '/set', 'supported_color_modes': ns.m}) %}
                      {% if 'color_temp' in ns.m %}{% set d = d | combine({'color_temp_kelvin': true, 'min_kelvin': state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000), 'max_kelvin': state_attr(repeat.item, 'max_color_temp_kelvin') | int(6535)}) %}{% endif %}
                      {% if 'rgb' in ns.m %}{% set d = d | combine({'brightness': true}) %}{% endif %}
                      {% set el = state_attr(repeat.item, 'effect_list') %}
                      {% if el %}{% set d = d | combine({'effect': true, 'effect_list': el}) %}{% endif %}
                      {{ d | to_json }}
            - conditions: "{{ domain == 'switch' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/switch/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({'state_topic': base ~ '/state', 'command_topic': base ~ '/set'}) | to_json }}
            - conditions: "{{ domain == 'sensor' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/sensor/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({
                        'state_topic': base ~ '/state',
                        'device_class': state_attr(repeat.item, 'device_class'),
                        'unit_of_measurement': state_attr(repeat.item, 'unit_of_measurement')
                      }) | to_json }}
            - conditions: "{{ domain == 'binary_sensor' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/binary_sensor/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({'state_topic': base ~ '/state', 'device_class': state_attr(repeat.item, 'device_class')}) | to_json }}
            - conditions: "{{ domain == 'fan' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/fan/{{ obj }}/config"
                    retain: true
                    # One JSON state topic and one JSON command topic; the unit
                    # converts with templates. Feature bits: 1 speed, 2 oscillate,
                    # 4 direction, 8 preset mode.
                    payload: >-
                      {% set f = state_attr(repeat.item, 'supported_features') | int(0) %}
                      {% set d = common | combine({'state_topic': base ~ '/state', 'command_topic': base ~ '/set', 'command_template': '{"state": "{{ value }}"}', 'state_value_template': '{{ value_json.state }}'}) %}
                      {% if (f // 1) % 2 == 1 %}{% set d = d | combine({'percentage_command_topic': base ~ '/set', 'percentage_command_template': '{"percentage": {{ value }}}', 'percentage_state_topic': base ~ '/state', 'percentage_value_template': '{{ value_json.percentage }}', 'speed_range_min': 1, 'speed_range_max': 100}) %}{% endif %}
                      {% if (f // 8) % 2 == 1 and state_attr(repeat.item, 'preset_modes') %}{% set d = d | combine({'preset_modes': state_attr(repeat.item, 'preset_modes'), 'preset_mode_command_topic': base ~ '/set', 'preset_mode_command_template': '{"preset_mode": "{{ value }}"}', 'preset_mode_state_topic': base ~ '/state', 'preset_mode_value_template': '{{ value_json.preset_mode }}'}) %}{% endif %}
                      {% if (f // 2) % 2 == 1 %}{% set d = d | combine({'oscillation_command_topic': base ~ '/set', 'oscillation_command_template': '{"oscillating": {{ "true" if value == "oscillate_on" else "false" }}}', 'oscillation_state_topic': base ~ '/state', 'oscillation_value_template': '{{ "oscillate_on" if value_json.oscillating else "oscillate_off" }}'}) %}{% endif %}
                      {% if (f // 4) % 2 == 1 %}{% set d = d | combine({'direction_command_topic': base ~ '/set', 'direction_command_template': '{"direction": "{{ value }}"}', 'direction_state_topic': base ~ '/state', 'direction_value_template': '{{ value_json.direction }}'}) %}{% endif %}
                      {{ d | to_json }}
            - conditions: "{{ domain == 'scene' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/scene/{{ obj }}/config"
                    retain: true
                    # MQTT scenes are command-only: no state topic.
                    payload: >-
                      {{ common | combine({'command_topic': base ~ '/set', 'payload_on': 'ON'}) | to_json }}
            - conditions: "{{ domain == 'cover' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/cover/{{ obj }}/config"
                    retain: true
                    # Feature bits: 1 open, 2 close, 4 set position, 8 stop.
                    # A null payload hides that button. Tilt is not carried.
                    payload: >-
                      {% set f = state_attr(repeat.item, 'supported_features') | int(0) %}
                      {% set d = common | combine({'state_topic': base ~ '/state', 'value_template': '{{ value_json.state }}', 'command_topic': base ~ '/set', 'payload_open': ('{"command": "open"}' if (f // 1) % 2 == 1 else none), 'payload_close': ('{"command": "close"}' if (f // 2) % 2 == 1 else none), 'payload_stop': ('{"command": "stop"}' if (f // 8) % 2 == 1 else none)}) %}
                      {% if state_attr(repeat.item, 'device_class') %}{% set d = d | combine({'device_class': state_attr(repeat.item, 'device_class')}) %}{% endif %}
                      {% if (f // 4) % 2 == 1 %}{% set d = d | combine({'position_topic': base ~ '/state', 'position_template': '{{ value_json.position }}', 'set_position_topic': base ~ '/set', 'set_position_template': '{"position": {{ position }}}', 'position_open': 100, 'position_closed': 0}) %}{% endif %}
                      {{ d | to_json }}
