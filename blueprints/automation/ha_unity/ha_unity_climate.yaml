# ha-unity (pre-1.0): synthetic climate. The policy, clamp, topic and payload
# logic are tested offline; the call into your climate entity is not (it depends
# on your controller). See docs/testing.md.
#
# On the hub, publish ONE synthetic climate entity to a unit, built from hub
# entities instead of a thermostat's own display. One automation per room per
# unit. Selected by trigger id:
#   resync / state : publish discovery + target + current temperature (+ action)
#   cmd            : clamp the guest's setpoint, call climate.set_temperature on
#                    the hub climate entity, optionally run an expiry action
#
# Inputs: a hub climate entity (what guests effectively set), a temperature
# sensor (shown as the current temperature), an optional target sensor (shown as
# the target instead of the climate entity's `temperature` attribute), and an
# optional mode sensor (heating / cooling / idle / off, shown as the card's
# action). Targets and temperatures are published as-is: hub and unit must use
# the same unit system, and `temperature_unit` must match it.
#
# POLICY: the hub climate entity must pass the same whitelist as other entities
# (unit or common label AND an area on the matching floors). If it does not,
# discovery is cleared and commands are ignored. The entity comes from this
# automation's inputs, never from the payload. The only thing a guest can
# change is the target temperature, clamped to min..max.
#
# EXPIRY (optional): with expire_after_minutes > 0, a guest setpoint is followed
# by a wait. If no newer command arrives before the timeout, expire_action runs
# (use it to clear your controller's override, e.g. a service call). A newer
# command restarts the countdown. Pending expiries are lost on a Home Assistant
# restart. A malformed newer command also cancels the previous countdown.
#
# This blueprint runs in parallel mode so a long expiry wait never blocks state
# publishing. State changes of the watched entities are filtered from the
# state_changed event stream, because optional entities cannot be state-trigger
# inputs.
#
# UNVERIFIED (depends on your climate entity):
#   - that it accepts climate.set_temperature
#   - that `modes: ["auto"]` with no mode topics gives a usable thermostat card
#   - the mode sensor's state strings (mapped: heating, cooling, idle, off)

blueprint:
  name: "ha-unity: synthetic climate"
  description: >-
    Publishes a climate entity backed by a hub climate entity to one unit and applies its
    clamped setpoint commands.
  domain: automation
  source_url: https://github.com/tmeuze/ha-unity/blob/main/blueprints/automation/ha_unity/ha_unity_climate.yaml
  input:
    unit:
      name: Unit prefix
      selector:
        text:
    object:
      name: Room slug
      description: "Lowercase slug used in topics, e.g. entry_hall"
      selector:
        text:
    command_topic:
      name: Command topic
      description: "Exactly <unit>/climate/<room slug>/target/set"
      selector:
        text:
    climate_entity:
      name: Hub climate entity
      description: "The climate entity (e.g. a room controller's override or target entity) that guests will effectively set."
      selector:
        entity:
          domain: climate
    current_sensor:
      name: Current temperature sensor
      description: "The temperature you consider true for the room; shown to the guest as the current temperature."
      selector:
        entity:
          domain: sensor
    target_sensor:
      name: Target temperature sensor (optional)
      description: "A sensor holding the target your controller is actually holding. If empty, the climate entity's `temperature` attribute is used."
      default: ""
      selector:
        entity:
          domain: sensor
    mode_sensor:
      name: Mode sensor (optional)
      description: "A sensor whose state is heating, cooling, idle or off. Shown as the thermostat card's action. Unknown states are not published."
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_unit:
      name: Temperature unit
      description: "Must match the unit system of the hub and the unit."
      default: "F"
      selector:
        select:
          options:
            - "F"
            - "C"
    min_temp:
      name: Minimum setpoint
      default: 64
      selector:
        number:
          min: 40
          max: 100
    max_temp:
      name: Maximum setpoint
      default: 80
      selector:
        number:
          min: 40
          max: 100
    unit_label:
      name: Unit label
      description: "Entities with this label (e.g. Live: Alpha) are exposed to this unit."
      selector:
        label: {}
    unit_floors:
      name: Unit floors
      description: "Floor(s) the unit label is valid on (e.g. Alpha). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    common_label:
      name: Common label
      description: "Entities with this label (e.g. Live: Shared) are exposed to every unit."
      selector:
        label: {}
    common_floors:
      name: Common floors
      description: "Floor(s) the common label is valid on (e.g. Shared). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    hub_status_topic:
      name: Hub availability topic
      description: "Retained topic that reads 'online' while the hub is up."
      default: "ha-unity/hub/status"
      selector:
        text:
    expire_after_minutes:
      name: Expire guest override after (minutes)
      description: "0 disables expiry. Otherwise expire_action runs this long after the last guest command."
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          mode: box
    expire_action:
      name: Expiry action
      description: "Actions to run when a guest override expires (e.g. a service call that clears your controller's override). Ignored when expiry is 0."
      default: []
      selector:
        action: {}

mode: parallel
max: 30
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: resync
  - trigger: event
    event_type: entity_registry_updated
    id: resync
  - trigger: event
    event_type: area_registry_updated
    id: resync
  - trigger: event
    event_type: floor_registry_updated
    id: resync
  - trigger: event
    event_type: label_registry_updated
    id: resync
  - trigger: event
    event_type: state_changed
    id: state
  - trigger: mqtt
    topic: !input command_topic
    id: cmd

variables:
  unit: !input unit
  obj: !input object
  rm: !input climate_entity
  cur: !input current_sensor
  lo: !input min_temp
  hi: !input max_temp
  unit_label: !input unit_label
  unit_floors: !input unit_floors
  common_label: !input common_label
  common_floors: !input common_floors
  hub_status_topic: !input hub_status_topic
  tgt: !input target_sensor
  md: !input mode_sensor
  t_unit: !input temperature_unit
  expire_min: !input expire_after_minutes
  watched: "{{ [rm, cur] + ([tgt] if tgt else []) + ([md] if md else []) }}"
  target_val: >-
    {% if tgt %}{{ states(tgt) }}{% else %}{{ state_attr(rm, 'temperature') }}{% endif %}
  action_val: >-
    {% set sv = (states(md) | lower) if md else '' %}{% if sv in ['heating', 'cooling', 'idle', 'off'] %}{{ sv }}{% endif %}
  base: "{{ unit }}/climate/{{ obj }}"
  allowed: >-
    {% set ns = namespace(ua=[], ca=[]) %}
    {% for f in unit_floors %}{% set ns.ua = ns.ua + floor_areas(f) %}{% endfor %}
    {% for f in common_floors %}{% set ns.ca = ns.ca + floor_areas(f) %}{% endfor %}
    {{ (rm in label_entities(unit_label) and area_id(rm) in ns.ua) or (rm in label_entities(common_label) and area_id(rm) in ns.ca) }}

actions:
  # State-change events are only for the watched entities; ignore the rest.
  - condition: template
    value_template: "{{ trigger.id != 'state' or trigger.event.data.entity_id in watched }}"
  - choose:
      # Command: re-check policy and topic, clamp, call the hub climate entity.
      - conditions: "{{ trigger.id == 'cmd' }}"
        sequence:
          - condition: template
            value_template: "{{ allowed and trigger.topic == base ~ '/target/set' }}"
          - condition: template
            value_template: "{{ trigger.payload | float(none) is not none }}"
          - action: climate.set_temperature
            target:
              entity_id: "{{ rm }}"
            data:
              temperature: "{{ [[trigger.payload | float, lo] | max, hi] | min }}"
          - if:
              - condition: template
                value_template: "{{ expire_min | int(0) > 0 }}"
            then:
              - wait_for_trigger:
                  - trigger: mqtt
                    topic: !input command_topic
                timeout:
                  minutes: "{{ expire_min }}"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                then: !input expire_action
    default:
      # Resync/state: revoke when not allowed, otherwise publish.
      - choose:
          - conditions: "{{ not allowed }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ unit }}/ha/climate/{{ obj }}/config"
                  payload: ""
                  retain: true
        default:
          - action: mqtt.publish
            data:
              topic: "{{ unit }}/ha/climate/{{ obj }}/config"
              retain: true
              payload: >-
                {{ {
                  'name': state_attr(rm, 'friendly_name'),
                  'unique_id': unit ~ '_climate_' ~ obj,
                  'temperature_unit': t_unit,
                  'min_temp': lo,
                  'max_temp': hi,
                  'temp_step': 1,
                  'modes': ['auto'],
                  'temperature_command_topic': base ~ '/target/set',
                  'temperature_state_topic': base ~ '/target/state',
                  'current_temperature_topic': base ~ '/current',
                  'availability': [{'topic': hub_status_topic}],
                  'availability_mode': 'all'
                } | combine({'action_topic': base ~ '/action'} if md else {}) | to_json }}
          - if:
              - condition: template
                value_template: "{{ states(cur) | float(none) is not none }}"
            then:
              - action: mqtt.publish
                data:
                  topic: "{{ base }}/current"
                  payload: "{{ states(cur) }}"
                  retain: true
          - if:
              - condition: template
                value_template: "{{ target_val | float(none) is not none }}"
            then:
              - action: mqtt.publish
                data:
                  topic: "{{ base }}/target/state"
                  payload: "{{ target_val }}"
                  retain: true
          - if:
              - condition: template
                value_template: "{{ action_val | string | length > 0 }}"
            then:
              - action: mqtt.publish
                data:
                  topic: "{{ base }}/action"
                  payload: "{{ action_val }}"
                  retain: true
