# PropSense (pre-1.0): publish state. Verified end to end on HA 2026.9.x.
#
# On the hub, publish retained state and availability for one unit's exposed
# entities. Same whitelist policy as propsense_publish_discovery.yaml (keep the
# `exposed` template identical). Only whitelisted entities are ever published.
#
# PERFORMANCE: this triggers on every state_changed event and filters, because
# a blueprint cannot subscribe to a computed entity list. Fine for a few
# hundred busy entities; a custom integration would be better beyond that. The
# queue is large on purpose: most runs exit at the condition, and a small
# queue would drop real updates during a burst.

blueprint:
  name: "PropSense: publish state"
  description: >-
    Publishes retained state to <unit>/<domain>/<object>/state and an
    availability marker for entities that pass the whitelist policy.
  domain: automation
  source_url: https://github.com/tmeuze/PropSense/blob/main/blueprints/automation/propsense/propsense_publish_state.yaml
  input:
    unit:
      name: Unit prefix
      selector:
        text:
    unit_label:
      name: Unit label
      description: "Entities with this label (e.g. Live: Alpha) are exposed to this unit."
      selector:
        label: {}
    unit_floors:
      name: Unit floors
      description: "Floor(s) the unit label is valid on (e.g. Alpha). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    common_label:
      name: Common label
      description: "Entities with this label (e.g. Live: Shared) are exposed to every unit."
      selector:
        label: {}
    common_floors:
      name: Common floors
      description: "Floor(s) the common label is valid on (e.g. Shared). Label AND floor are both required."
      selector:
        floor:
          multiple: true

# A hub can hold thousands of entities, so state_changed
# is busy. Most runs exit at the condition; a small queue would drop real
# updates under a burst, so keep it large.
mode: queued
max: 200
max_exceeded: silent

triggers:
  - trigger: event
    event_type: state_changed
    id: change
  - trigger: homeassistant
    event: start
    id: resync
  # Safety net only: everything else is event driven.
  - trigger: time_pattern
    hours: "/6"
    minutes: "5"
    seconds: "0"
    id: resync
  - trigger: event
    event_type: entity_registry_updated
    id: resync
  - trigger: event
    event_type: area_registry_updated
    id: resync
  - trigger: event
    event_type: floor_registry_updated
    id: resync
  - trigger: event
    event_type: label_registry_updated
    id: resync

variables:
  unit: !input unit
  unit_label: !input unit_label
  unit_floors: !input unit_floors
  common_label: !input common_label
  common_floors: !input common_floors
  domains: ["light", "switch", "sensor", "binary_sensor"]
  exposed: >-
    {% set ns = namespace(ua=[], ca=[], out=[]) %}
    {% for f in unit_floors %}{% set ns.ua = ns.ua + floor_areas(f) %}{% endfor %}
    {% for f in common_floors %}{% set ns.ca = ns.ca + floor_areas(f) %}{% endfor %}
    {% for e in label_entities(unit_label) %}
      {% if area_id(e) in ns.ua and e.split('.')[0] in domains and e not in ns.out %}{% set ns.out = ns.out + [e] %}{% endif %}
    {% endfor %}
    {% for e in label_entities(common_label) %}
      {% if area_id(e) in ns.ca and e.split('.')[0] in domains and e not in ns.out %}{% set ns.out = ns.out + [e] %}{% endif %}
    {% endfor %}
    {{ ns.out }}

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: resync
      - condition: template
        value_template: "{{ trigger.event.data.entity_id in exposed }}"

actions:
  - variables:
      targets: "{{ exposed if trigger.id == 'resync' else [trigger.event.data.entity_id] }}"
  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            domain: "{{ repeat.item.split('.')[0] }}"
            obj: "{{ repeat.item.split('.')[1] }}"
            base: "{{ unit }}/{{ repeat.item.split('.')[0] }}/{{ repeat.item.split('.')[1] }}"
            s: "{{ states(repeat.item) }}"
            ok: "{{ s not in ['unavailable', 'unknown'] }}"
        - action: mqtt.publish
          data:
            topic: "{{ base }}/availability"
            payload: "{{ 'online' if ok else 'offline' }}"
            retain: true
        - condition: template
          value_template: "{{ ok }}"
        - action: mqtt.publish
          data:
            topic: "{{ base }}/state"
            retain: true
            payload: >-
              {% if domain == 'light' %}
                {% set d = {'state': s | upper} %}
                {% set cm0 = state_attr(repeat.item, 'color_mode') %}
                {% set cm = 'rgb' if cm0 in ['rgbw', 'rgbww'] else ('brightness' if cm0 == 'white' else cm0) %}
                {% if state_attr(repeat.item, 'brightness') is not none %}{% set d = d | combine({'brightness': state_attr(repeat.item, 'brightness')}) %}{% endif %}
                {% if cm %}{% set d = d | combine({'color_mode': cm}) %}{% endif %}
                {% if cm == 'color_temp' and state_attr(repeat.item, 'color_temp_kelvin') is not none %}{% set d = d | combine({'color_temp': state_attr(repeat.item, 'color_temp_kelvin')}) %}{% endif %}
                {% if cm == 'hs' and state_attr(repeat.item, 'hs_color') %}{% set c = state_attr(repeat.item, 'hs_color') %}{% set d = d | combine({'color': {'h': c[0], 's': c[1]}}) %}{% endif %}
                {% if cm == 'xy' and state_attr(repeat.item, 'xy_color') %}{% set c = state_attr(repeat.item, 'xy_color') %}{% set d = d | combine({'color': {'x': c[0], 'y': c[1]}}) %}{% endif %}
                {% if cm == 'rgb' and state_attr(repeat.item, 'rgb_color') %}{% set c = state_attr(repeat.item, 'rgb_color') %}{% set d = d | combine({'color': {'r': c[0], 'g': c[1], 'b': c[2]}}) %}{% endif %}
                {{ d | to_json }}
              {% elif domain in ['switch', 'binary_sensor'] %}
                {{ s | upper }}
              {% else %}
                {{ s }}
              {% endif %}
