# PropSense (pre-1.0): publish discovery. Verified end to end on HA 2026.9.x.
#
# On the hub, publish retained MQTT discovery for one unit's exposed entities
# (lights, switches, sensors, binary sensors). Create one automation per unit.
#
# WHITELIST POLICY (fail closed). An entity is exposed to a unit only if
#   (the unit label AND an area on one of the unit's floors)
#   OR (the common label AND an area on one of the common floors),
# and its domain is in the hardcoded list below. Unlabelled entities, entities
# with no area, entities on any floor you do not list, and a label on the wrong
# floor are never exposed. The domain list is deliberately not an input.
#
# Keep the `exposed` template identical in the discovery, state and command
# blueprints. tests/policy_model.py models the intended logic.
#
# Each entity gets a device block (identifiers scoped to the unit) and a
# suggested_area. If area_prefix_regex matches the hub area name, the prefix is
# stripped ("L2 Kitchen" -> "Kitchen"); areas on the common floors pass through
# unchanged; otherwise no suggested_area is sent.
#
# KNOWN GAP: entities deleted from HA entirely keep a stale retained discovery
# topic on the broker. Revocation (label removed, area or floor changed)
# publishes an empty retained payload.

blueprint:
  name: "PropSense: publish discovery"
  description: >-
    Publishes retained MQTT discovery under <unit>/ha/ for entities that pass
    the whitelist policy, and clears it for entities that no longer do.
  domain: automation
  source_url: https://github.com/tmeuze/PropSense/blob/main/blueprints/automation/propsense/propsense_publish_discovery.yaml
  input:
    unit:
      name: Unit prefix
      description: "Topic prefix and child name, e.g. alpha. Lowercase, no slashes."
      selector:
        text:
    unit_label:
      name: Unit label
      description: "Entities with this label (e.g. Live: Alpha) are exposed to this unit."
      selector:
        label: {}
    unit_floors:
      name: Unit floors
      description: "Floor(s) the unit label is valid on (e.g. Alpha). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    common_label:
      name: Common label
      description: "Entities with this label (e.g. Live: Shared) are exposed to every unit."
      selector:
        label: {}
    common_floors:
      name: Common floors
      description: "Floor(s) the common label is valid on (e.g. Shared). Label AND floor are both required."
      selector:
        floor:
          multiple: true
    hub_status_topic:
      name: Hub availability topic
      description: "Retained topic that reads 'online' while the hub is up (its MQTT will message should set 'offline'). Child entities are unavailable unless it reads online."
      default: "propsense/hub/status"
      selector:
        text:
    area_prefix_regex:
      name: Area prefix to strip (optional)
      description: "Regex for a prefix on hub area names that should NOT reach the child, e.g. ^L[0-9]+  turns 'L2 Kitchen' into 'Kitchen' for suggested_area. Leave empty to send names unchanged."
      default: ""
      selector:
        text:

mode: restart
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
  # Safety net only: everything else is event driven.
  - trigger: time_pattern
    hours: "/6"
    minutes: "0"
    seconds: "0"
  - trigger: event
    event_type: entity_registry_updated
  - trigger: event
    event_type: device_registry_updated
  - trigger: event
    event_type: area_registry_updated
  - trigger: event
    event_type: floor_registry_updated
  - trigger: event
    event_type: label_registry_updated

variables:
  unit: !input unit
  unit_label: !input unit_label
  unit_floors: !input unit_floors
  common_label: !input common_label
  common_floors: !input common_floors
  hub_status_topic: !input hub_status_topic
  area_prefix: !input area_prefix_regex
  domains: ["light", "switch", "sensor", "binary_sensor"]

actions:
  # Debounce bursts of registry events (mode: restart cancels earlier runs).
  - delay: "00:00:05"
  - variables:
      exposed: >-
        {% set ns = namespace(ua=[], ca=[], out=[]) %}
        {% for f in unit_floors %}{% set ns.ua = ns.ua + floor_areas(f) %}{% endfor %}
        {% for f in common_floors %}{% set ns.ca = ns.ca + floor_areas(f) %}{% endfor %}
        {% for e in label_entities(unit_label) %}
          {% if area_id(e) in ns.ua and e.split('.')[0] in domains and e not in ns.out %}{% set ns.out = ns.out + [e] %}{% endif %}
        {% endfor %}
        {% for e in label_entities(common_label) %}
          {% if area_id(e) in ns.ca and e.split('.')[0] in domains and e not in ns.out %}{% set ns.out = ns.out + [e] %}{% endif %}
        {% endfor %}
        {{ ns.out }}
      common_area_names: >-
        {% set ns = namespace(n=[]) %}
        {% for f in common_floors %}{% for a in floor_areas(f) %}{% set ns.n = ns.n + [area_name(a)] %}{% endfor %}{% endfor %}
        {{ ns.n }}
      stale: >-
        {% set ns = namespace(out=[]) %}
        {% for s in states %}
          {% if s.domain in domains and s.entity_id not in exposed %}
            {% set ns.out = ns.out + [s.entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}

  # Revoke: clear discovery for anything that is not (or no longer) exposed.
  - repeat:
      for_each: "{{ stale }}"
      sequence:
        - action: mqtt.publish
          data:
            topic: "{{ unit }}/ha/{{ repeat.item.split('.')[0] }}/{{ repeat.item.split('.')[1] }}/config"
            payload: ""
            retain: true

  # Publish discovery for exposed entities.
  - repeat:
      for_each: "{{ exposed }}"
      sequence:
        - variables:
            domain: "{{ repeat.item.split('.')[0] }}"
            obj: "{{ repeat.item.split('.')[1] }}"
            base: "{{ unit }}/{{ repeat.item.split('.')[0] }}/{{ repeat.item.split('.')[1] }}"
            # With area_prefix_regex "^L[0-9]+ ", a hub area named "L2 Kitchen" reaches the
            # child as "Kitchen".
            # No Lx prefix (catch-all or common areas) => no suggested_area
            # for the unit catch-alls; common areas pass their own name.
            area_nm: "{{ area_name(repeat.item) }}"
            sa: >-
              {% if area_nm and area_prefix and area_nm is match(area_prefix) -%}{{ area_nm | regex_replace(area_prefix, '') }}{%- elif area_nm and area_nm in common_area_names -%}{{ area_nm }}{%- endif %}
            dev_id: "{{ device_id(repeat.item) }}"
            dev_name: "{{ device_attr(dev_id, 'name') if dev_id else state_attr(repeat.item, 'friendly_name') }}"
            fname: "{{ state_attr(repeat.item, 'friendly_name') }}"
            # MQTT entities with a device are named "<device> <entity name>", so
            # sending the full friendly name doubles it. Send null when the
            # entity IS the device, else the name minus the device-name prefix.
            ent_name: >-
              {% if not dev_name or fname == dev_name %}{{ none }}{% elif fname.startswith(dev_name ~ ' ') %}{{ fname[(dev_name | length + 1):] }}{% else %}{{ fname }}{% endif %}
            device: >-
              {% set d = {
                'identifiers': [unit ~ '_dev_' ~ (dev_id if dev_id else repeat.item)],
                'name': dev_name
              } %}
              {% if sa %}{% set d = d | combine({'suggested_area': sa}) %}{% endif %}
              {{ d }}
            common: >-
              {{ {
                'device': device,
                'name': ent_name,
                'unique_id': unit ~ '_' ~ repeat.item.replace('.', '_'),
                'state_topic': base ~ '/state',
                'availability': [{'topic': hub_status_topic}, {'topic': base ~ '/availability'}],
                'availability_mode': 'all'
              } }}
        - choose:
            - conditions: "{{ domain == 'light' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/light/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({
                        'schema': 'json',
                        'command_topic': base ~ '/set',
                        'brightness': state_attr(repeat.item, 'brightness') is not none or 'brightness' in (state_attr(repeat.item, 'supported_color_modes') or [])
                      }) | to_json }}
            - conditions: "{{ domain == 'switch' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/switch/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({'command_topic': base ~ '/set'}) | to_json }}
            - conditions: "{{ domain == 'sensor' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/sensor/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({
                        'device_class': state_attr(repeat.item, 'device_class'),
                        'unit_of_measurement': state_attr(repeat.item, 'unit_of_measurement')
                      }) | to_json }}
            - conditions: "{{ domain == 'binary_sensor' }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ unit }}/ha/binary_sensor/{{ obj }}/config"
                    retain: true
                    payload: >-
                      {{ common | combine({'device_class': state_attr(repeat.item, 'device_class')}) | to_json }}
